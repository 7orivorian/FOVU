plugins {
    id 'net.fabricmc.fabric-loom' version "${loom_version}"
    id 'maven-publish'
}

group = project.maven_group

def minVersionSplit = project.min_minecraft_version.split("\\.")
def maxVersionSplit = project.max_minecraft_version.split("\\.")

boolean hyphenate = false
if (minVersionSplit.length >= 2 && maxVersionSplit.length >= 2) {
    int min_mc_ver_minor = Integer.parseInt(minVersionSplit[1])
    int max_mc_ver_minor = Integer.parseInt(maxVersionSplit[1])
    hyphenate = max_mc_ver_minor > min_mc_ver_minor
}

if (minVersionSplit.length >= 3 && maxVersionSplit.length >= 3) {
    int min_mc_ver_patch = Integer.parseInt(minVersionSplit[2])
    int max_mc_ver_patch = Integer.parseInt(maxVersionSplit[2])
    hyphenate |= max_mc_ver_patch > min_mc_ver_patch
}

version = hyphenate ?
        "${project.mod_version}-[${project.min_minecraft_version}-${project.max_minecraft_version}]" :
        "${project.mod_version}-[${project.max_minecraft_version}]"

repositories {

}

loom {

}

dependencies {
    // See the gradle.properties file to change the version
    minecraft "com.mojang:minecraft:${project.max_minecraft_version}"
    implementation "net.fabricmc:fabric-loader:${project.loader_version}"
}

processResources {
    def version = project.version
    inputs.property "version", version

    def minVersion = project.min_minecraft_version
    inputs.property "base_minecraft_version", minVersion

    def maxVersion = project.max_minecraft_version
    inputs.property "minecraft_version", maxVersion

    def loaderVersion = project.loader_version
    inputs.property "loader_version", loaderVersion

    filesMatching("fabric.mod.json") {
        expand "version": version,
                max_minecraft_version: maxVersion,
                min_minecraft_version: minVersion,
                "loader_version": loaderVersion
    }
}

tasks.withType(JavaCompile).configureEach {
    it.options.release = 25
}

java {
    // Loom will automatically attach sourcesJar to a RemapSourcesJar task and to the "build" task
    // if it is present.
    // If you remove this line, sources will not be generated.
    withSourcesJar()

    sourceCompatibility = JavaVersion.VERSION_25
    targetCompatibility = JavaVersion.VERSION_25
}

jar {
    def projectName = project.name
    inputs.property "projectName", projectName

    from("LICENSE") {
        rename { "${it}_${projectName}" }
    }
}

// configure the maven publication
publishing {
    publications {
        create("mavenJava", MavenPublication) {
            from components.java
        }
    }

    // See https://docs.gradle.org/current/userguide/publishing_maven.html for information on how to set up publishing.
    repositories {
        // Add repositories to publish to here.
        // Notice: This block does NOT have the same function as the block in the top level.
        // The repositories here will be used for publishing your artifact, not for
        // retrieving dependencies.
    }
}